

services:
  mysql:
    image: mysql:8.0
    container_name: ${MYSQL_CONTAINER_NAME}
    ports:
      - "${MYSQL_PORT_HOST}:${MYSQL_PORT}"
    environment:
      MYSQ_USER: ${MYSQL_USER}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
    volumes:
      - ./database/init_dummy_db.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "mysql", "-uroot", "-p${MYSQL_ROOT_PASSWORD}", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:14
    container_name: ${POSTGRES_CONTAINER_NAME}
    ports:
      - "${POSTGRES_PORT_HOST}:${POSTGRES_PORT}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DB}
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  etl:
    build:
      context: ./elt-data
    container_name: quiz_elt
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env

  api:
    build:
      context: ./api-app
    container_name: quiz_api
    ports:
      - "${API_PORT_HOST}:${API_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env

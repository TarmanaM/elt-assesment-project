version: '3.3'

services:
  mysql:
    image: mysql:8.0
    container_name: ${MYSQL_CONTAINER_NAME}
    ports:
      - "${MYSQL_PORT_HOST}:${MYSQL_PORT}"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
     
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
    volumes:
      - ./database/init_dummy_db.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - .env

  postgres:
    image: postgres:14
    container_name: ${POSTGRES_CONTAINER_NAME}
    ports:
    - "${POSTGRES_PORT_HOST}:${POSTGRES_PORT}"
    environment:
  
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DB}
    env_file:
      - .env
  etl:
    build:
      context: ./elt-data
    container_name: quiz_elt
    depends_on:
      - mysql
      - postgres
    env_file:
    - .env

